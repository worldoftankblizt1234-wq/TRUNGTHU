<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test — Mapbox mặc định + Locate + Lane Guidance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  
  #map { width: 100%; height: 55vh; }
  
  .panel {
    padding: 14px 16px;
    background: #1e293b;
    border-bottom: 2px solid #334155;
  }
  
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  
  input {
    flex: 1; min-width: 160px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  
  button:hover { background: #2563eb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .btn-route {
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    width: 100%;
  }
  
  .info {
    padding: 14px 16px;
    background: #0f172a;
    font-size: 13px;
    line-height: 1.5;
    border-top: 2px solid #334155;
    max-height: 45vh;
    overflow-y: auto;
  }
  
  .summary {
    padding: 12px 16px;
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    border-radius: 10px;
    margin-bottom: 10px;
    color: white;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  
  .summary-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }
  
  .lane-step {
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #1e293b;
    border-radius: 10px;
    border-left: 3px solid #3b82f6;
  }
  
  .lane-step .instr {
    font-size: 13px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  
  .lane-step .dist {
    font-size: 11px;
    color: #94a3b8;
    font-family: monospace;
    margin-bottom: 8px;
  }
  
  .lanes {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  
  .lane {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    border-radius: 8px;
    background: #334155;
    font-size: 16px;
    min-width: 46px;
  }
  
  .lane.active {
    background: linear-gradient(135deg, #10b981, #34d399);
    color: white;
    box-shadow: 0 3px 10px rgba(16, 185, 129, 0.4);
  }
  
  .lane.inactive {
    opacity: 0.35;
  }
  
  .lane .arrow { font-size: 18px; line-height: 1; }
  .lane .label {
    font-size: 8px;
    font-weight: 800;
    opacity: 0.85;
    text-transform: uppercase;
  }
  
  .no-lane {
    font-size: 11px;
    color: #64748b;
    font-style: italic;
  }
  
  .error { color: #f87171; padding: 10px; }

  /* ⭐ Locate button style */
  .leaflet-control-locate a {
    color: #3b82f6 !important;
    font-size: 18px !important;
  }
  .leaflet-control-locate.active a {
    color: #10b981 !important;
  }
</style>
</head>
<body>

<div class="panel">
  <div class="row">
    <input id="to" placeholder="Điểm đến (lat,lng)" value="10.8231,106.6297" />
    <button id="btnGo">Đi tới</button>
  </div>
  <div class="row">
    <button class="btn-route" id="btnRoute">
      <i>📍</i> Chỉ đường từ vị trí của tôi + Lane
    </button>
  </div>
</div>

<div id="map"></div>

<div class="info" id="info">
  <div style="color:#94a3b8">
    <b>💡 Hướng dẫn:</b><br/>
    1. Bấm nút <b>📍 Chỉ đường từ vị trí của tôi + Lane</b> để lấy vị trí GPS<br/>
    2. Hoặc bấm <b>nút định vị tròn</b> trên bản đồ (góc phải) để nhảy về vị trí mình<br/>
    3. Zoom sâu để xem làn đường trên Mapbox<br/>
    4. 3 layer mặc định: <b>Mapbox</b> → <b>Thunderforest</b> → <b>Vệ tinh</b>
  </div>
</div>

<script>
const MAPBOX_TOKEN = 'pk.eyJ1IjoibWluaGFkb2YxIiwiYSI6ImNtdjdiZXlldTBxMnMyeHB3dXg2b2tlM2UifQ.ObuY1SJde-IPn044csY_jA';

let map;
let routeLayer = null;
let userMarker = null;

/* ⭐ 3 layer — THỨ TỰ: Mapbox (mặc định) → Thunderforest → Vệ tinh */
const TILE_LAYERS = {
  mapbox: {
    name: '🚗 Mapbox',
    url: `https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}?access_token=${MAPBOX_TOKEN}`,
    options: {
      attribution: '© Mapbox © OpenStreetMap',
      tileSize: 512,
      zoomOffset: -1,
      maxZoom: 22,
      maxNativeZoom: 22,
      detectRetina: true
    }
  },
  thunderforest: {
    name: '🗺️ Thunderforest',
    url: 'https://{s}.tile.thunderforest.com/neighbourhood/{z}/{x}/{y}.png?apikey=9ac7b28593764dd996f9300417076ffd',
    options: {
      attribution: '© Thunderforest © OpenStreetMap',
      subdomains: 'abc',
      maxZoom: 22
    }
  },
  satellite: {
    name: '🛰️ Vệ tinh',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    options: {
      attribution: 'Tiles © Esri',
      maxZoom: 22,
      maxNativeZoom: 19
    }
  }
};

/* =========================================================
   INIT MAP
   ========================================================= */
function initMap() {
  map = L.map('map', {
    center: [10.7769, 106.7009],
    zoom: 15,
    maxZoom: 22,
    scrollWheelZoom: true
  });

  // Tạo 3 layer
  const mapboxLayer = L.tileLayer(TILE_LAYERS.mapbox.url, TILE_LAYERS.mapbox.options);
  const tfLayer = L.tileLayer(TILE_LAYERS.thunderforest.url, TILE_LAYERS.thunderforest.options);
  const satLayer = L.tileLayer(TILE_LAYERS.satellite.url, TILE_LAYERS.satellite.options);

  // ⭐ Layer mặc định: Mapbox
  mapboxLayer.addTo(map);

  // ⭐ Layer control — thứ tự: Mapbox → Thunderforest → Vệ tinh
  L.control.layers({
    [TILE_LAYERS.mapbox.name]: mapboxLayer,
    [TILE_LAYERS.thunderforest.name]: tfLayer,
    [TILE_LAYERS.satellite.name]: satLayer
  }, null, {
    position: 'topright',
    collapsed: true
  }).addTo(map);

  // ⭐ Locate Control — nút xanh
  L.control.locate({
    position: 'topright',
    strings: { title: 'Vị trí của tôi' },
    locateOptions: {
      enableHighAccuracy: true,
      maxZoom: 18,
      watch: false,
      timeout: 10000
    },
    icon: '📍',
    iconLoading: '⏳',
    showPopup: false,
    setView: 'untilPanOrZoom',
    flyTo: true,
    drawCircle: true,
    drawMarker: true,
    circleStyle: {
      color: '#10b981',
      fillColor: '#10b981',
      fillOpacity: 0.15,
      weight: 2
    },
    markerStyle: {
      color: '#10b981',
      fillColor: '#10b981',
      fillOpacity: 0.9
    }
  }).addTo(map);
}

/* =========================================================
   HELPERS
   ========================================================= */
function parseLatLng(str) {
  const parts = str.split(',').map(s => parseFloat(s.trim()));
  if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return { lat: parts[0], lng: parts[1] };
}

function formatDistance(m) {
  if (m < 1000) return Math.round(m) + ' m';
  return (m / 1000).toFixed(2) + ' km';
}

function formatDuration(s) {
  const mins = Math.round(s / 60);
  if (mins < 60) return mins + ' phút';
  const h = Math.floor(mins / 60);
  return h + 'h ' + (mins % 60) + 'm';
}

function getUserLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Trình duyệt không hỗ trợ định vị'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      }),
      (err) => {
        let msg = 'Không lấy được vị trí';
        if (err.code === 1) msg = 'Bạn đã từ chối quyền truy cập vị trí';
        else if (err.code === 2) msg = 'Không xác định được vị trí';
        else if (err.code === 3) msg = 'Hết thời gian lấy vị trí';
        reject(new Error(msg));
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  });
}

/* ⭐ Lane Icon Generator */
function laneIcon(modifiers) {
  if (!modifiers || !modifiers.length) return '↑';
  const hasLeft = modifiers.some(m => m.includes('left'));
  const hasStraight = modifiers.some(m => m.includes('straight'));
  const hasRight = modifiers.some(m => m.includes('right'));
  const hasUturn = modifiers.some(m => m.includes('uturn'));

  if (hasUturn && modifiers.length === 1) return '⤵';
  if (hasLeft && hasStraight && hasRight) return '↰↑↱';
  if (hasLeft && hasStraight) return '↰↑';
  if (hasStraight && hasRight) return '↑↱';
  if (hasLeft && hasRight) return '↰↱';
  if (hasLeft) return '↰';
  if (hasRight) return '↱';
  if (hasStraight) return '↑';
  return '↑';
}

/* =========================================================
   MAPBOX DIRECTIONS + LANE
   ========================================================= */
async function getRoute(from, to) {
  const url = `https://api.mapbox.com/directions/v5/mapbox/driving/` +
    `${from.lng},${from.lat};${to.lng},${to.lat}` +
    `?access_token=${MAPBOX_TOKEN}` +
    `&steps=true` +
    `&banner_instructions=true` +
    `&geometries=geojson` +
    `&overview=full` +
    `&language=vi`;

  const res = await fetch(url);
  if (!res.ok) throw new Error(`Mapbox ${res.status}`);
  const data = await res.json();
  
  if (data.code !== 'Ok' || !data.routes || !data.routes.length) {
    throw new Error(data.message || 'Không tìm được đường');
  }
  
  return data.routes[0];
}

/* =========================================================
   VẼ ROUTE + RENDER LANE PANEL
   ========================================================= */
function drawRoute(route, from, to) {
  // Xoá cũ
  if (routeLayer) map.removeLayer(routeLayer);
  if (userMarker) map.removeLayer(userMarker);
  map.eachLayer(layer => {
    if (layer instanceof L.Marker && layer !== userMarker) map.removeLayer(layer);
  });

  // Vẽ đường
  const coords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
  routeLayer = L.polyline(coords, {
    color: '#3b82f6',
    weight: 6,
    opacity: 0.85,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);

  // Marker user
  const userIcon = L.divIcon({
    className: 'user-marker-wrapper',
    html: '<div style="background:#10b981;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 4px rgba(16,185,129,0.3);"></div>',
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });
  userMarker = L.marker([from.lat, from.lng], { icon: userIcon })
    .addTo(map)
    .bindPopup('<b>📍 Bạn ở đây</b>');

  // Marker đích
  L.marker([to.lat, to.lng]).addTo(map).bindPopup('<b>🏁 Điểm đến</b>');

  // Fit bounds
  map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
}

function renderLanePanel(route) {
  const info = document.getElementById('info');
  
  let html = `<div class="summary">
    <div class="summary-item">🛣️ ${formatDistance(route.distance)}</div>
    <div class="summary-item">⏱️ ${formatDuration(route.duration)}</div>
    <div class="summary-item" style="opacity:0.75;font-size:11px;">Mapbox</div>
  </div>`;
  
  const steps = route.legs[0].steps;
  let laneCount = 0;
  
  steps.forEach((step, idx) => {
    const instr = step.maneuver?.instruction || '(không có hướng dẫn)';
    const dist = step.distance;
    const banner = step.bannerInstructions?.[0];
    const lanes = banner?.sub?.components?.[0]?.lanes 
               || banner?.primary?.components?.[0]?.lanes 
               || [];
    
    if (lanes && lanes.length) laneCount++;
    
    html += `<div class="lane-step">`;
    html += `<div class="instr">${idx + 1}. ${instr}</div>`;
    html += `<div class="dist">📏 ${formatDistance(dist)}</div>`;
    
    if (lanes && lanes.length) {
      html += `<div class="lanes">`;
      lanes.forEach(lane => {
        const active = lane.active ? 'active' : 'inactive';
        const icon = laneIcon(lane.indications || []);
        const label = (lane.indications || [])
          .map(i => i.replace('straight', 'thẳng').replace('left', 'trái').replace('right', 'phải').replace('uturn', 'quay đầu'))
          .join('/') || '—';
        html += `
          <div class="lane ${active}">
            <span class="arrow">${icon}</span>
            <span class="label">${label}</span>
          </div>
        `;
      });
      html += `</div>`;
    } else {
      html += `<div class="no-lane">(Không có data làn ở bước này)</div>`;
    }
    
    html += `</div>`;
  });
  
  if (laneCount === 0) {
    html += `<div class="no-lane" style="padding:10px;">
      ℹ️ Khu vực này chưa có dữ liệu làn đường. Thử toạ độ ở TP.HCM trung tâm.
    </div>`;
  }
  
  info.innerHTML = html;
}

/* =========================================================
   EVENTS
   ========================================================= */
document.getElementById('btnGo').addEventListener('click', () => {
  const to = parseLatLng(document.getElementById('to').value);
  if (!to) {
    alert('Toạ độ không hợp lệ! Nhập dạng: lat,lng');
    return;
  }
  map.setView([to.lat, to.lng], 17);
});

document.getElementById('btnRoute').addEventListener('click', async () => {
  const btn = document.getElementById('btnRoute');
  const info = document.getElementById('info');
  const to = parseLatLng(document.getElementById('to').value);
  
  if (!to) {
    info.innerHTML = '<div class="error">❌ Toạ độ điểm đến không hợp lệ</div>';
    return;
  }
  
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳ Đang tìm đường...';
  info.innerHTML = '<div style="color:#94a3b8">📍 Đang lấy vị trí GPS...</div>';
  
  try {
    const from = await getUserLocation();
    console.log('📍 Vị trí user:', from);
    
    info.innerHTML = '<div style="color:#94a3b8">🚗 Đang gọi Mapbox Directions API...</div>';
    const route = await getRoute(from, to);
    
    drawRoute(route, from, to);
    renderLanePanel(route);
    
    console.log('✅ Route OK:', formatDistance(route.distance), formatDuration(route.duration));
    
  } catch (err) {
    console.error(err);
    info.innerHTML = `<div class="error">❌ Lỗi: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
});

/* =========================================================
   START
   ========================================================= */
initMap();

console.log('🧪 Test ready!');
console.log('3 layer: Mapbox (default) → Thunderforest → Vệ tinh');
console.log('Nút định vị góc phải + nút "Chỉ đường từ vị trí của tôi"');
</script>
</body>
</html>
