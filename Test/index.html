<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>🧪 Test Voice + Lane Guidance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  #map { height: 40vh; width: 100%; }
  .panel { padding: 14px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
  .btn-route { background: #3b82f6; color: white; }
  .btn-voice { background: #ec4899; color: white; }
  .btn-voice.active { background: #10b981; }
  .btn-clear { background: #475569; color: white; }
  .log { background: #1e293b; border-radius: 10px; padding: 12px; font-size: 0.75rem; font-family: monospace; max-height: 140px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; }
  .log .speak { color: #34d399; }
  .log .skip { color: #f87171; }
  .log .info { color: #60a5fa; }
  .log .lane { color: #fbbf24; }

  #lanePanel { display: none; background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; max-height: 260px; overflow-y: auto; }
  .lane-step { margin-bottom: 8px; padding: 10px; background: #0f172a; border-radius: 8px; border-left: 3px solid #3b82f6; }
  .lane-step .instr { font-weight: 700; color: #e2e8f0; font-size: 0.8rem; margin-bottom: 3px; }
  .lane-step .dist { color: #64748b; font-family: monospace; font-size: 0.7rem; margin-bottom: 6px; }
  .lane-step .lanes { display: flex; gap: 6px; flex-wrap: wrap; }
  .lane { padding: 6px 10px; border-radius: 8px; text-align: center; min-width: 46px; }
  .lane.active { background: #10b981; color: white; }
  .lane.inactive { background: #334155; color: #94a3b8; opacity: 0.45; }
  .lane .arrow { font-size: 18px; line-height: 1; }
  .lane .label { font-size: 8px; font-weight: 800; text-transform: uppercase; margin-top: 2px; }
  .no-lane { color: #475569; font-style: italic; font-size: 11px; }

  #nextPanel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,15,30,0.92); color: white; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 0.9rem; display: none; max-width: calc(100% - 40px); text-align: center; z-index: 9999; }
  #nextPanel.show { display: block; }

  #liveStatus { background: #1e293b; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 0.8rem; margin-bottom: 10px; color: #60a5fa; }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel">
  <button class="btn btn-route" id="btnRoute">🗺️ Chỉ đường từ vị trí của tôi</button>
  <button class="btn btn-voice" id="btnVoice">🔊 Bật voice dẫn đường</button>
  <button class="btn btn-clear" id="btnClear">🗑️ Xoá đường đi</button>

  <div id="liveStatus">Chưa có route</div>
  <div id="lanePanel"></div>
  <div class="log" id="log">Sẵn sàng. Bấm "Chỉ đường" trước.</div>
</div>

<div id="nextPanel"></div>

<script>
/* ===== CẤU HÌNH ===== */
const WORKER_URL = 'https://map-birthday.anhminhadof123.workers.dev';
const DEST = { lat: 10.982032, lng: 106.897494 }; // Tọa độ đích

/* ===== STATE ===== */
let map, routeLayer, userMarker, destMarker;
let voiceEnabled = false;
let voiceRouteSteps = null;
let voiceCurrentStepIndex = 0;
let voiceSpokenMarks = new Map();
let voiceCheckInterval = null;
let voiceArrivalSpoken = false;
let lastUserPosition = null;
let watchId = null;

/* ===== HELPERS ===== */
function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = type;
  line.textContent = `[${new Date().toLocaleTimeString('vi-VN')}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDistance(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`; }

function getVietnameseVoice() {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'vi-VN') || voices.find(v => v.lang.startsWith('vi'));
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN';
  u.rate = 1.0;
  const vi = getVietnameseVoice();
  if (vi) u.voice = vi;
  speechSynthesis.speak(u);
  log(`🔊 ${text}`, 'speak');
}

function updateNextPanel(text) {
  const p = document.getElementById('nextPanel');
  if (text) { p.textContent = text; p.classList.add('show'); }
  else p.classList.remove('show');
}

function updateLiveStatus(text) {
  document.getElementById('liveStatus').textContent = text;
}

function getSpokenMarks(i) {
  if (!voiceSpokenMarks.has(i)) voiceSpokenMarks.set(i, new Set());
  return voiceSpokenMarks.get(i);
}

/* ===== LANE ICON ===== */
function laneIcon(modifiers) {
  if (!modifiers?.length) return '↑';
  const hasLeft = modifiers.some(m => m.includes('left'));
  const hasStraight = modifiers.some(m => m.includes('straight'));
  const hasRight = modifiers.some(m => m.includes('right'));
  const hasUturn = modifiers.some(m => m.includes('uturn'));
  if (hasUturn && modifiers.length === 1) return '⤵';
  if (hasLeft && hasStraight && hasRight) return '↰↑↱';
  if (hasLeft && hasStraight) return '↰↑';
  if (hasStraight && hasRight) return '↑↱';
  if (hasLeft && hasRight) return '↰↱';
  if (hasLeft) return '↰';
  if (hasRight) return '↱';
  return '↑';
}

function laneLabel(modifiers) {
  if (!modifiers?.length) return '—';
  return modifiers.map(i =>
    i.replace('straight', 'thẳng').replace('left', 'trái').replace('right', 'phải').replace('uturn', 'quay đầu')
  ).join('/');
}

/* ===== RENDER LANE PANEL ===== */
function renderLanePanel(steps) {
  const panel = document.getElementById('lanePanel');
  let html = '';
  let laneCount = 0;
  let detailLog = [];

  steps.forEach((step, idx) => {
    const instr = step.maneuver?.instruction || '(không có hướng dẫn)';
    const banner = step.bannerInstructions?.[0];
    const lanes = banner?.sub?.components?.[0]?.lanes
               || banner?.primary?.components?.[0]?.lanes
               || [];

    if (lanes.length) laneCount++;
    if (banner) detailLog.push(`Bước ${idx+1}: có banner, lanes=${lanes.length}`);
    else detailLog.push(`Bước ${idx+1}: KHÔNG có bannerInstructions`);

    html += `<div class="lane-step">`;
    html += `<div class="instr">${idx+1}. ${instr}</div>`;
    html += `<div class="dist">📏 ${formatDistance(step.distance)}</div>`;

    if (lanes.length) {
      html += `<div class="lanes">`;
      lanes.forEach(l => {
        const active = l.active ? 'active' : 'inactive';
        html += `<div class="lane ${active}">`;
        html += `<div class="arrow">${laneIcon(l.indications || [])}</div>`;
        html += `<div class="label">${laneLabel(l.indications || [])}</div>`;
        html += `</div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="no-lane">Không có dữ liệu làn</div>`;
    }
    html += `</div>`;
  });

  panel.innerHTML = laneCount > 0
    ? html
    : `<div style="color:#f59e0b;padding:8px;">⚠️ Route này không có dữ liệu làn đường (0/${steps.length} bước)</div>`;
  panel.style.display = 'block';

  log(`🛣️ Lane panel: ${laneCount}/${steps.length} bước có dữ liệu làn`, 'lane');
  detailLog.slice(0, 5).forEach(l => log(`  ${l}`, 'lane'));
  if (detailLog.length > 5) log(`  ... và ${detailLog.length - 5} bước nữa`, 'lane');
}

/* ===== ROUTING ===== */
async function getRoute(from, to) {
  const url = `${WORKER_URL}/mapbox-route?from=${from.lng},${from.lat}&to=${to.lng},${to.lat}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Worker ${res.status}`);
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes?.length) throw new Error('Không có route');
  return data.routes[0];
}

function getUserLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
      e => reject(new Error(e.message)),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

/* ===== DRAW ===== */
function drawRoute(route, from, to) {
  if (routeLayer) map.removeLayer(routeLayer);
  if (userMarker) map.removeLayer(userMarker);
  if (destMarker) map.removeLayer(destMarker);

  userMarker = L.marker([from.lat, from.lng]).addTo(map).bindPopup('📍 Bạn ở đây');
  const coords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
  routeLayer = L.polyline(coords, { color: '#3b82f6', weight: 6, opacity: 0.85 }).addTo(map);
  destMarker = L.marker([to.lat, to.lng]).addTo(map).bindPopup('🏁 Điểm đến');
  map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
}

/* ===== VOICE — PHIÊN BẢN HOÀN CHỈNH ===== */
function checkAndSpeak(userLat, userLng, steps) {
  if (!voiceEnabled || !steps?.length) return;

  const total = steps.length;

  // 1. Kiểm tra đến đích
  const lastStep = steps[total - 1];
  if (lastStep?.maneuver?.location) {
    const d = calcDistance(userLat, userLng, lastStep.maneuver.location[1], lastStep.maneuver.location[0]);
    if (d < 30 && !voiceArrivalSpoken) {
      voiceArrivalSpoken = true;
      speak('Đã đến nơi. Cảm ơn bạn đã theo dõi.');
      updateNextPanel('🎉 Đã đến nơi');
      return;
    }
  }

  const i = voiceCurrentStepIndex;
  if (i >= total) return;
  const step = steps[i];
  if (!step?.maneuver?.location) { voiceCurrentStepIndex = i + 1; return; }

  const stepLat = step.maneuver.location[1];
  const stepLng = step.maneuver.location[0];
  const dist = Math.round(calcDistance(userLat, userLng, stepLat, stepLng));
  const instruction = step.maneuver.instruction || 'tiếp tục';

  updateLiveStatus(`Bước ${i+1}/${total} • còn ${dist}m • ${instruction}`);

  // 2. Đã qua bước này → chuyển bước
  if (dist < 20) {
    log(`✅ Qua bước ${i+1}`, 'info');
    voiceCurrentStepIndex = i + 1;
    return;
  }

  const spoken = getSpokenMarks(i);

  // 3. Chỉ áp dụng quy tắc "luôn đọc" khi route >= 5 bước
  if (total >= 5) {
    const isFirst = (i === 0);
    const isSecondLast = (i === total - 2); // X - 1, với X = total - 1 (số thứ tự bước kề cuối)
    const isLast = (i === total - 1);
    const isSpecial = isFirst || isSecondLast || isLast;

    if (isSpecial) {
      if (!spoken.has('special')) {
        spoken.add('special');
        speak(instruction);
        updateNextPanel(`🔔 ${instruction}`);
        return;
      }
      if (dist <= 20 && !spoken.has('action')) {
        spoken.add('action');
        speak(instruction);
        updateNextPanel(`🔔 ${instruction}`);
      }
      return;
    }
  }

  // 4. Quy tắc đọc theo khoảng cách (>=)
  let shouldRead = false;
  let readType = '';

  if (dist >= 100 && dist <= 999) {
    const lastTwo = dist % 100;
    if (lastTwo >= 80) { shouldRead = true; readType = 'xyz'; }
  } else if (dist >= 10 && dist <= 99) {
    const lastDigit = dist % 10;
    if (lastDigit >= 8) { shouldRead = true; readType = 'xy'; }
  } else if (dist >= 5 && dist <= 9) {
    if (dist >= 4) { shouldRead = true; readType = 'x'; }
  }

  // 5. Đọc chính xác nếu thỏa, chống lặp
  if (shouldRead) {
    const key = `exact_${dist}`;
    if (!spoken.has(key) && !spoken.has('recentExact')) {
      spoken.add(key);
      spoken.add('recentExact');
      setTimeout(() => spoken.delete('recentExact'), 4000);

      let speakText, displayText;
      if (readType === 'x' || dist <= 10) {
        speakText = instruction;
        displayText = `🔔 ${instruction}`;
      } else {
        speakText = `Sau ${dist} mét, ${instruction.toLowerCase()}`;
        displayText = `${dist}m — ${instruction}`;
      }
      speak(speakText);
      updateNextPanel(displayText);
      return;
    }
  }

  // 6. Luôn đọc lần cuối khi xuống dưới 20m
  if (dist <= 20 && !spoken.has('action')) {
    spoken.add('action');
    speak(instruction);
    updateNextPanel(`🔔 ${instruction}`);
  }
}

/* ===== VOICE CONTROL ===== */
function enableVoice() {
  if (!voiceRouteSteps?.length) {
    alert('Bấm "Chỉ đường" trước đã!');
    return;
  }
  voiceEnabled = true;
  voiceCurrentStepIndex = 0;
  voiceSpokenMarks = new Map();
  voiceArrivalSpoken = false;
  document.getElementById('btnVoice').classList.add('active');
  document.getElementById('btnVoice').textContent = '🔊 Voice đang bật (bấm để tắt)';

  const first = voiceRouteSteps[0];
  if (first?.maneuver) {
    const instr = first.maneuver.instruction || 'Đi thẳng';
    const d = first.distance || 0;
    speak(d > 100 ? `Bắt đầu dẫn đường. Đi thẳng ${formatDistance(d)}, sau đó ${instr.toLowerCase()}` : `Bắt đầu dẫn đường. ${instr}`);
  }

  if (voiceCheckInterval) clearInterval(voiceCheckInterval);
  voiceCheckInterval = setInterval(() => {
    if (!voiceEnabled || !lastUserPosition) return;
    checkAndSpeak(lastUserPosition.lat, lastUserPosition.lng, voiceRouteSteps);
  }, 2000);

  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(
    p => {
      lastUserPosition = { lat: p.coords.latitude, lng: p.coords.longitude };
      if (userMarker) userMarker.setLatLng([lastUserPosition.lat, lastUserPosition.lng]);
    },
    e => log(`⚠️ GPS: ${e.message}`, 'skip'),
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
}

function disableVoice() {
  voiceEnabled = false;
  if (voiceCheckInterval) { clearInterval(voiceCheckInterval); voiceCheckInterval = null; }
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('btnVoice').classList.remove('active');
  document.getElementById('btnVoice').textContent = '🔊 Bật voice dẫn đường';
  updateNextPanel('');
  updateLiveStatus('Voice đã tắt');
  log('🔇 Đã tắt voice', 'skip');
}

/* ===== EVENTS ===== */
document.getElementById('btnRoute').addEventListener('click', async () => {
  const btn = document.getElementById('btnRoute');
  btn.disabled = true;
  btn.textContent = '⏳ Đang tìm đường...';
  try {
    const from = await getUserLocation();
    log(`📍 Vị trí của bạn: ${from.lat.toFixed(6)}, ${from.lng.toFixed(6)}`, 'info');
    const route = await getRoute(from, DEST);
    drawRoute(route, from, DEST);
    voiceRouteSteps = route.legs[0].steps;
    log(`✅ Route: ${formatDistance(route.distance)}, ${route.legs[0].steps.length} bước`, 'info');
    renderLanePanel(route.legs[0].steps);
    updateLiveStatus(`Route sẵn sàng: ${route.legs[0].steps.length} bước`);
    btn.textContent = '🗺️ Chỉ đường lại';
  } catch (e) {
    log(`❌ Lỗi: ${e.message}`, 'skip');
    btn.textContent = '🗺️ Chỉ đường từ vị trí của tôi';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btnVoice').addEventListener('click', () => {
  if (voiceEnabled) disableVoice(); else enableVoice();
});

document.getElementById('btnClear').addEventListener('click', () => {
  disableVoice();
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  voiceRouteSteps = null;
  document.getElementById('lanePanel').style.display = 'none';
  updateLiveStatus('Chưa có route');
  map.setView([DEST.lat, DEST.lng], 15);
  log('🗑️ Đã xoá route', 'skip');
});

/* ===== INIT MAP ===== */
map = L.map('map').setView([DEST.lat, DEST.lng], 15);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© Esri', maxZoom: 19
}).addTo(map);
L.marker([DEST.lat, DEST.lng]).addTo(map).bindPopup('🏁 Điểm đến test').openPopup();

if (window.speechSynthesis) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => log('🔈 Đã load voices', 'info');
}

log('✅ Sẵn sàng test. Đích: 10.982032, 106.897494', 'info');
</script>
</body>
</html>
